# Gradle build settings for the iSH Android app.
#
# This file was missing from the project, which is why CI failed with:
#   Configuration `:app:debugRuntimeClasspath` contains AndroidX dependencies,
#   but the `android.useAndroidX` property is not enabled
# AGP 8 refuses to build a project that mixes AndroidX artifacts without opting in
# here, and there is no usable default for it.

# AndroidX is required by appcompat / material / webkit in app/build.gradle.
android.useAndroidX=true

# AGP 8 behaviour, and it skips generating one R class per dependency.
android.nonTransitiveRClass=true

# Kotlin sources are UTF-8 (the terminal glyphs in strings.xml are not ASCII).
kotlin.code.style=official

org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8

# CI runs a single build per job with --no-daemon anyway; keeping this explicit
# avoids a Gradle daemon being spawned inside the Actions runner.
org.gradle.daemon=false
