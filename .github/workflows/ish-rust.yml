name: iSH Rust Core

on:
  push:
    paths:
      - 'ish-rs/**'
      - '.github/workflows/ish-rust.yml'
  pull_request:
    paths:
      - 'ish-rs/**'
      - '.github/workflows/ish-rust.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Format, test, and lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ish-rs
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: rustfmt, clippy
      # The pre-port source predates this workflow and intentionally keeps its
      # generated decoder table byte-stable. Check the new leaf modules rather
      # than `src/lib.rs`, whose module declarations make rustfmt recursively
      # visit the generated output.
      - run: >-
          rustfmt --check --edition 2021
          src/cpu.rs src/user.rs src/task.rs src/group.rs src/getset.rs src/tls.rs src/misc.rs src/ipc.rs src/log.rs src/fake_db.rs src/migrate.rs src/rebuild.rs src/resource.rs src/random.rs src/uname.rs src/sync.rs src/timer.rs src/futex.rs src/fchdir.rs src/stat.rs tests/fpu_differential.rs tests/fake_db_migrate_differential.rs tests/fake_db_rebuild_differential.rs tests/sync_differential.rs tests/timer_differential.rs tests/futex_differential.rs tests/fchdir_differential.rs tests/stat_differential.rs
      - name: Test
        run: |
          set -o pipefail
          cargo test --all-targets --no-fail-fast 2>&1 | tee /tmp/ish-rust-test.log
      # A failing test binary stops the others, so the failure is reported in
      # two places a human (or a script with API access) can read: the job
      # summary, and one error annotation per failing test/panic line. The raw
      # log itself is not always downloadable.
      - name: Report the failure
        if: failure()
        run: |
          grep -aE "^test .* FAILED|panicked at|test result: FAILED|^error" /tmp/ish-rust-test.log \
            | head -10 | sed 's/%/%25/g' \
            | while IFS= read -r line; do
                echo "::error title=cargo test --all-targets::$line"
              done
          {
            echo '### cargo test --all-targets'
            echo
            echo '```text'
            grep -aE "FAILED|panicked|assertion|test result|left:|right:|^error" /tmp/ish-rust-test.log | tail -60
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - run: cargo clippy --all-targets -- -D warnings
