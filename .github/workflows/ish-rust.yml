name: iSH Rust Core

on:
  push:
    paths:
      - 'ish-rs/**'
      - '.github/workflows/ish-rust.yml'
  pull_request:
    paths:
      - 'ish-rs/**'
      - '.github/workflows/ish-rust.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Format, test, and lint
    runs-on: ubuntu-latest
    # No cap here meant a hung test burned the full 6h workflow timeout.
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ish-rs
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: rustfmt, clippy
      # The pre-port source predates this workflow and intentionally keeps its
      # generated decoder table byte-stable. Check the new leaf modules rather
      # than `src/lib.rs`, whose module declarations make rustfmt recursively
      # visit the generated output.
      - run: >-
          rustfmt --check --edition 2021
          src/cpu.rs src/user.rs src/task.rs src/group.rs src/getset.rs src/tls.rs src/misc.rs src/ipc.rs src/log.rs src/fake_db.rs src/resource.rs src/random.rs src/uname.rs tests/fpu_differential.rs
      - name: Test all targets (names the offender if it hangs)
        run: |
          # Not a plain `cargo test --all-targets`: that hung for hours and the log said
          # nothing. With output redirected libtest prints a test line only once the test
          # FINISHES, so a hung test leaves no trace whatsoever - the earlier "last line
          # without a verdict" heuristic matched nothing. Forcing a single thread makes the
          # run order equal the --list order, so the first listed test that never reported
          # is the one that was executing when the timeout fired. Same tests, same exit
          # code, just identifiable.
          set +e
          # CARGO_TERM_COLOR=never matters: libtest colourises its verdicts even when
          # piped, and the pattern 'test ... ok$' silently failed to match an escaped
          # line - which is why a previous run printed "see log tail" instead of a name.
          CARGO_TERM_COLOR=never timeout 1500 cargo test --all-targets -- --test-threads=1 > /tmp/all.log 2>&1
          rc=$?
          CARGO_TERM_COLOR=never cargo test --all-targets -- --list --format terse > /tmp/list.log 2>&1 || true
          set -e
          for f in all list; do sed -i -e 's/\x1b\[[0-9;]*m//g' /tmp/$f.log 2>/dev/null || true; done
          tail -n 25 /tmp/all.log
          FAILED=$(grep -E '^test .* \.\.\. FAILED$' /tmp/all.log | head -5 | awk '{print $2}' | paste -sd ' ' - || true)
          LAST=$(grep -E '^test .* \.\.\. ok$' /tmp/all.log | tail -1 | awk '{print $2}' || true)
          HUNG=$(awk -v last="$LAST" 'index($0, last ": test")==1 {p=1; next} p && /: test$/ {sub(/: test.*/,""); print; exit}' /tmp/list.log || true)
          if [ -z "$HUNG" ] && [ -z "$LAST" ]; then
            HUNG=$(grep -m1 ': test$' /tmp/list.log | sed 's/: test$//' || true)
          fi
          if [ "$rc" -ne 0 ]; then
            {
              echo "### cargo test --all-targets (exit $rc)"
              echo "- failed: ${FAILED:-none reported}"
              echo "- last test that completed: ${LAST:-none}"
              echo "- test that was running when it stopped: ${HUNG:-unknown}"
              echo "- timeout used: 25m (exit 124 means it was still running)"
            } >> "$GITHUB_STEP_SUMMARY"
            if [ "$rc" = "124" ]; then
              # Printed on its own line deliberately: workflow commands are only recognised at the
              # start of a log line, and the step has just tailed a log whose final line may have no
              # newline (that is exactly what a hung test looks like) - gluing onto it silently loses
              # the annotation, which cost two debugging rounds here.
              echo ""
              echo "::error::cargo test hung for 25m on ${HUNG:-an unidentifiable test} (last completed: ${LAST:-none})"
            else
              # Printed on its own line deliberately: workflow commands are only recognised at the
              # start of a log line, and the step has just tailed a log whose final line may have no
              # newline (that is exactly what a hung test looks like) - gluing onto it silently loses
              # the annotation, which cost two debugging rounds here.
              echo ""
              echo "::error::cargo test --all-targets failed (exit $rc): ${FAILED:-${HUNG:-see log tail}}"
            fi
            exit "$rc"
          fi

      # One-off isolation probe, informational only (it always exits 0 so it cannot
      # soften the verdict above). cargo test --all-targets has to be killed at 25m and
      # the annotation now names gui::tests::terminal_manager_maps; what decides the fix
      # is whether that test hangs on its own or only after another test has run, since
      # both share the static OnceLock<Mutex<TerminalManager>> in src/gui.rs.
      - name: Isolate the hanging test
        if: always()
        run: |
          set +e
          CARGO_TERM_COLOR=never timeout 300 cargo test --lib gui::tests::terminal_manager_maps -- --exact > /tmp/alone.log 2>&1
          alone=$?
          CARGO_TERM_COLOR=never timeout 300 cargo test --lib -- --test-threads=1 gui::tests::terminal_create_pseudo gui::tests::terminal_manager_maps > /tmp/pair.log 2>&1
          pair=$?
          MSG="terminal_manager_maps alone exit=$alone (124=hung, 0=passed); after terminal_create_pseudo exit=$pair (124=hung => interaction through the shared static)"
          echo "$MSG"
          echo "::notice::$MSG"
          {
            echo '### isolation probe'
            echo '```'
            echo "alone (124 = hung):"; tail -n 6 /tmp/alone.log
            echo; echo "pair (124 = hung):"; tail -n 6 /tmp/pair.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Lint, naming every denial
        run: |
          # Zero-warning policy, but *enumerated*: `-D warnings` was the obvious way to
          # enforce it and it has a cost - rustc stops promoting later passes once the
          # first batch of denials has turned into errors, so each push revealed about
          # seven more lints and burned a CI cycle per batch.  Running clippy without -D
          # lets the whole crate graph report everything, and the *count* below is what
          # fails the job, so nothing is silenced.  De-colour first: the '^error'/'^warning'
          # patterns would otherwise be matched against lines that begin with escape codes.
          set +e
          CARGO_TERM_COLOR=never cargo clippy --all-targets --message-format=short > /tmp/clippy.log 2>&1
          rc=$?
          set -e
          sed -i -e 's/\x1b\[[0-9;]*m//g' /tmp/clippy.log || true
          # --message-format=short renders one lint per line as `src/x.rs:1:5: warning: msg [lint::name]`
          grep -E '^[^ ]+\.rs:[0-9]+:[0-9]+: (warning|error): ' /tmp/clippy.log | sed 's/^ *//' | sort -u > /tmp/clippy-lints.txt
          lints=$(wc -l < /tmp/clippy-lints.txt | tr -d ' ')
          echo "clippy exit=$rc, distinct lints=$lints"
          head -n 40 /tmp/clippy-lints.txt
          if [ "$rc" -ne 0 ] || [ "$lints" -gt 0 ]; then
            MSG=$(head -n 14 /tmp/clippy-lints.txt | sed 's/%/%25/g' | awk '{printf "%s%s", (NR>1?"%0A":""), $0}')
            echo ""
            echo "::error::cargo clippy --all-targets reports $lints distinct lint(s) (exit $rc; zero warnings is the policy): %0A${MSG}"
            { printf '\n### clippy (exit %s, %s distinct lints)\n\n```\n' "$rc" "$lints"; cat /tmp/clippy-lints.txt; printf '\n```\n'; } >> "$GITHUB_STEP_SUMMARY"
            [ "$rc" -ne 0 ] && exit "$rc"
            exit 1
          fi