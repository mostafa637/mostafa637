name: iSH Rust Core

on:
  push:
    paths:
      - 'ish-rs/**'
      - '.github/workflows/ish-rust.yml'
  pull_request:
    paths:
      - 'ish-rs/**'
      - '.github/workflows/ish-rust.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Format, test, and lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ish-rs
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: rustfmt, clippy
      # The pre-port source predates this workflow and intentionally keeps its
      # generated decoder table byte-stable. Check the new leaf modules rather
      # than `src/lib.rs`, whose module declarations make rustfmt recursively
      # visit the generated output.
      - run: >-
          rustfmt --check --edition 2021
          src/cpu.rs src/user.rs src/task.rs src/group.rs src/getset.rs src/tls.rs src/misc.rs src/ipc.rs src/log.rs src/fake_db.rs src/migrate.rs src/rebuild.rs src/resource.rs src/random.rs src/uname.rs src/sync.rs src/timer.rs tests/fpu_differential.rs tests/fake_db_migrate_differential.rs tests/fake_db_rebuild_differential.rs tests/sync_differential.rs tests/timer_differential.rs
      - run: cargo test --all-targets
      - run: cargo clippy --all-targets -- -D warnings
