name: Build iSH Go/Gio

on:
  push:
    branches: [main, ish-qt-qml]
    paths:
      - 'ish-qt-qml/go-port/**'
      - '.github/workflows/build-go-gio.yml'
  pull_request:
    branches: [main, ish-qt-qml]
    paths:
      - 'ish-qt-qml/go-port/**'
      - '.github/workflows/build-go-gio.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  GO_VERSION: '1.25.x'
  GO_MODULE_DIR: ish-qt-qml/go-port
  ANDROID_MIN_SDK: '28'
  ANDROID_TARGET_SDK: '36'
  ANDROID_BUILD_TOOLS: '36.0.0'
  ANDROID_NDK: '27.2.12479018'
  GIO_VERSION: 'v0.10.2'
  GOGIO_VERSION: 'v0.10.0'
  APK_SIGN_PASSWORD: ish-qt-ci-release

jobs:
  go-test-and-linux:
    name: Go tests, LLVM lowering and Linux Gio
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: ${{ env.GO_MODULE_DIR }}/go.sum

      - name: Install Linux and LLVM dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm-18 clang-18 lld-18 libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libegl1-mesa-dev libgl1-mesa-dev

      - name: Download Go modules
        working-directory: ${{ env.GO_MODULE_DIR }}
        run: go mod download

      - name: Format, vet and test
        working-directory: ${{ env.GO_MODULE_DIR }}
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test -count=1 ./...

      - name: Test x86_64 to LLVM IR and host object code
        working-directory: ${{ env.GO_MODULE_DIR }}
        run: |
          go run ./cmd/ish-go-translator -hex 48c7c0010000004883c002c3 > /tmp/ish-go-sample.ll
          grep -q 'define' /tmp/ish-go-sample.ll
          go run ./cmd/ish-go-translator \
            -hex 48c7c0010000004883c002c3 \
            -llc llc-18 \
            -o /tmp/ish-go-sample.o
          test -s /tmp/ish-go-sample.o
          file /tmp/ish-go-sample.o

      - name: Build Linux Gio executable
        working-directory: ${{ env.GO_MODULE_DIR }}
        run: |
          mkdir -p dist
          CGO_ENABLED=1 GOOS=linux GOARCH=amd64 go build -trimpath \
            -ldflags "-s -w -X gioui.org/app.ID=org.ish.go" \
            -o dist/ish-go-linux-x86_64 ./cmd/ish-go-gui
          test -x dist/ish-go-linux-x86_64

      - name: Upload Linux and Go diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: ish-go-gio-linux-x86_64
          path: |
            ${{ env.GO_MODULE_DIR }}/dist/ish-go-linux-x86_64
            /tmp/ish-go-sample.ll
            /tmp/ish-go-sample.o
          if-no-files-found: error

  build-android:
    name: Go/Gio Android ${{ matrix.arch }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            abi: arm64-v8a
          - arch: amd64
            abi: x86_64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: ${{ env.GO_MODULE_DIR }}/go.sum

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK and NDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_TARGET_SDK}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "emulator" \
            "ndk;${ANDROID_NDK}"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/${ANDROID_NDK}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/${ANDROID_NDK}" >> "$GITHUB_ENV"

      - name: Install gogio
        run: |
          GOBIN="$HOME/go/bin" go install gioui.org/cmd/gogio@${GOGIO_VERSION}
          echo "$HOME/go/bin" >> "$GITHUB_PATH"
          gogio -h

      - name: Download Go modules
        working-directory: ${{ env.GO_MODULE_DIR }}
        run: go mod download

      - name: Test Go packages
        working-directory: ${{ env.GO_MODULE_DIR }}
        run: go test ./...

      - name: Build signed Gio APK
        working-directory: ${{ env.GO_MODULE_DIR }}
        env:
          GOGIO_SIGNPASS: ${{ env.APK_SIGN_PASSWORD }}
        run: |
          mkdir -p dist
          gogio -x \
            -target android \
            -arch "${{ matrix.arch }}" \
            -minsdk "${ANDROID_MIN_SDK}" \
            -targetsdk "${ANDROID_TARGET_SDK}" \
            -appid org.ish.go \
            -version 0.1.0.1 \
            -signkey "${GITHUB_WORKSPACE}/ish-qt-qml/ci/keys/ish-qt-ci-release.keystore" \
            -signpass "${GOGIO_SIGNPASS}" \
            -o "dist/ish-go-${{ matrix.abi }}.apk" \
            ./cmd/ish-go-gui
          test -s "dist/ish-go-${{ matrix.abi }}.apk"

      - name: Verify APK signature
        working-directory: ${{ env.GO_MODULE_DIR }}
        run: |
          "$ANDROID_SDK_ROOT/build-tools/${ANDROID_BUILD_TOOLS}/apksigner" verify --verbose "dist/ish-go-${{ matrix.abi }}.apk"

      - name: Upload signed Gio APK
        uses: actions/upload-artifact@v4
        with:
          name: ish-go-gio-android-${{ matrix.abi }}
          path: ${{ env.GO_MODULE_DIR }}/dist/ish-go-${{ matrix.abi }}.apk
          if-no-files-found: error

  test-android-avd:
    name: Go/Gio Android AVD smoke test (Linux + KVM)
    needs: build-android
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install emulator packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-${ANDROID_TARGET_SDK}" "build-tools;${ANDROID_BUILD_TOOLS}" "emulator" "system-images;android-35;google_apis;x86_64"

      - name: Enable KVM
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -e /dev/kvm
          ls -l /dev/kvm

      - name: Download x86_64 Gio APK
        uses: actions/download-artifact@v4
        with:
          name: ish-go-gio-android-x86_64
          path: apk

      - name: Run x86_64 AVD and install APK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            set -euo pipefail
            adb install -r apk/ish-go-x86_64.apk
            adb shell pm list packages | grep -q org.ish.go
            adb shell monkey -p org.ish.go 1
            sleep 8
            adb shell dumpsys window windows | grep -q org.ish.go
            adb shell screencap -p /sdcard/ish-go.png
            adb pull /sdcard/ish-go.png avd-ish-go.png

      - name: Upload AVD screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ish-go-gio-android-avd-screenshot
          path: avd-ish-go.png
          if-no-files-found: warn
