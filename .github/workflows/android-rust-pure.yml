name: iSH Android Pure Rust (Rust core + Slint logic)

# Scope: the pure-Rust side only - ish-emu core tests, android-rs logic, the desktop
# binary that exercises the same UI code paths.
#
# The APK build and the Android emulator run now live in android-emulator.yml
# ("Android Emulator Smoke Test"). They used to be duplicated here, which meant two
# 50-minute jobs racing to configure the same AVD and two copies of the same
# emulator script to keep in sync. Emulator work happens in exactly one workflow.

on:
  push:
    branches: [main, 'arena/**']
    paths:
      - 'android-rs/**'
      - 'ish-rs/**'
      - '.github/scripts/**'
      - '.github/workflows/android-rust-pure.yml'
  pull_request:
    paths:
      - 'android-rs/**'
      - 'ish-rs/**'
      - '.github/scripts/**'
  workflow_dispatch:

concurrency:
  group: android-rust-pure-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust-core-test-online:
    name: Rust core + android-rs logic ONLINE (no --offline)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Install system deps for Slint
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libfontconfig1-dev

      # Clones libapps, rebuilds hterm_all.js like the iSH iOS Xcode phase does, and
      # falls back to the committed bundle if the network misbehaves. It also asserts
      # the invariant the app needs: term.html + hterm_all.js + term.js + term.css
      # present, and term.js bridging to window.Android.onLoad.
      - name: Prepare hterm terminal assets
        run: bash .github/scripts/init-hterm-assets.sh

      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: rustfmt, clippy

      - name: Test ish-emu core ONLINE (no offline)
        working-directory: ish-rs
        run: |
          echo "=== ish-emu: cargo fetch + full lib test, ONLINE ONLY ==="
          cargo --version
          cargo fetch 2>&1 | tail -n 20
          cargo test --lib -- --list 2>&1 | tail -n 20
          if timeout 600 cargo test --lib -- --test-threads=1 > /tmp/core-test.log 2>&1; then
            echo "core lib tests passed"
            tail -n 20 /tmp/core-test.log
            exit 0
          fi
          # A hang and a real failure look the same from here, so re-run per module to
          # name the offender instead of leaving a 40-minute timeout as the only clue.
          echo "::warning::full lib test run failed or timed out - isolating per module"
          tail -n 40 /tmp/core-test.log
          for mod in generic getset group gui init inode interrupt ipc kernel list lock log \
                     mem memory misc mm mmap mmu modrm mount path personality pipe poll proc \
                     ptrace pty ram random real refcount resource signal sock sock_restart \
                     stat sync task time timer tlb tls tmp tty uname user vdso vec; do
            timeout 60 cargo test --lib "$mod" -- --test-threads=1 2>&1 | tail -n 5 \
              || echo "module $mod timed out or failed after 60s"
          done
          echo "=== per-module results above; full run log tail: ==="
          exit 1

      - name: Test android-rs logic ONLINE (fast-test, no heavy Slint compile)
        working-directory: android-rs
        run: |
          echo "=== android-rs fast-test: skips Slint so this stays quick ==="
          cargo fetch 2>&1 | tail -n 10
          cargo test --lib --no-default-features --features fast-test 2>&1 | tail -n 60

      - name: Test android-rs with SlintUi (best effort, bounded)
        working-directory: android-rs
        continue-on-error: true
        run: |
          echo "=== Slint build can take 10-20m; fast-test above is the gate ==="
          timeout 900 cargo test --lib --features slint-ui 2>&1 | tail -n 60 \
            || echo "Slint test timed out or failed - fast-test already covered the logic"

      - name: Run desktop binary (same UI logic the Android shell drives)
        working-directory: android-rs
        run: |
          cargo run --bin ish-android-rs --no-default-features --features fast-test 2>&1 | tail -n 60
