name: GTK Android Emulator

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  emulator-test:
    name: Install and run GTK APK
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run APK on Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_2
          force-avd-creation: true
          cores: 4
          ram-size: 4096M
          heap-size: 1024M
          disk-size: 4096M
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect
          disable-animations: true
          script: |
            set -e
            adb wait-for-device
            adb shell getprop sys.boot_completed | grep -q 1
            sleep 15
            adb install -r gtk-hello-android/gtk-hello-android-release.apk
            adb shell pm clear com.example.gtkhelloworld || true
            adb shell am force-stop com.example.gtkhelloworld || true
            adb logcat -c || true
            timeout 30s adb shell am start -n com.example.gtkhelloworld/org.gtk.android.ToplevelActivity
            sleep 25
            adb exec-out screencap -p > gtk-hello-android/emulator-screen-before-dismiss.png || true
            # Android API 34 may show a transient System UI ANR dialog while
            # background phone services finish booting. Dismiss it if present.
            adb shell input tap 540 1060 || true
            adb shell input keyevent KEYCODE_BACK || true
            sleep 8
            adb logcat -d -v threadtime > gtk-hello-android/logcat.txt || true
            adb shell dumpsys window windows > gtk-hello-android/windows.txt || true
            adb exec-out screencap -p > gtk-hello-android/emulator-screen.png || true
            grep -q 'GTK Hello World: activate started' gtk-hello-android/logcat.txt
            grep -q 'GTK Hello World: window presented' gtk-hello-android/logcat.txt
            adb shell ps -A | grep -q 'com.example.gtkhelloworld'
            adb shell dumpsys activity activities | grep -q 'org.gtk.android.ToplevelActivity'

      - name: Upload APK and emulator screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gtk-hello-android-results
          path: |
            gtk-hello-android/gtk-hello-android-release.apk
            gtk-hello-android/emulator-screen.png
            gtk-hello-android/emulator-screen-before-dismiss.png
            gtk-hello-android/logcat.txt
            gtk-hello-android/windows.txt
            if-no-files-found: warn

      - name: Publish emulator diagnostics branch
        if: always() && github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ ! -f gtk-hello-android/emulator-screen.png ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --orphan debug/emulator-latest
          git rm -r --cached . >/dev/null 2>&1 || true
          git add gtk-hello-android/emulator-screen.png gtk-hello-android/emulator-screen-before-dismiss.png gtk-hello-android/logcat.txt gtk-hello-android/windows.txt
          git commit -m "chore: publish latest emulator diagnostics [skip ci]" || true
          git push origin HEAD:refs/heads/debug/emulator-latest --force
