name: GTK Android Emulator

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  emulator-test:
    name: Install and run GTK APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run APK on Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          force-avd-creation: false
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot
          disable-animations: true
          script: |
            set -e
            adb wait-for-device
            adb install -r gtk-hello-android/gtk-hello-android-release.apk
            adb shell pm clear com.example.gtkhelloworld || true
            adb shell monkey -p com.example.gtkhelloworld 1
            sleep 15
            adb shell pidof com.example.gtkhelloworld
            adb shell dumpsys activity activities | grep -q 'com.example.gtkhelloworld'
            adb exec-out screencap -p > gtk-hello-android/emulator-screen.png

      - name: Upload APK and emulator screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gtk-hello-android-results
          path: |
            gtk-hello-android/gtk-hello-android-release.apk
            gtk-hello-android/emulator-screen.png
          if-no-files-found: warn
