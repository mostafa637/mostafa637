name: Android Emulator Smoke Test

# One place for "build the APK and prove it runs on a real emulator".
# The config below follows the action's own README (ReactiveCircus/android-emulator-runner):
#   * enable KVM perms, otherwise /dev/kvm exists but the runner cannot use it and
#     x86_64 images refuse to boot -> "Timeout waiting for emulator to boot."
#   * never pass -accel on by hand: the action's disable-linux-hw-accel=auto adds
#     -accel off when KVM is missing; a manual -accel on just hard-fails the boot.
#   * cold boot every run (-no-snapshot) is the other half of that timeout, so the
#     AVD + its boot snapshot are cached and reused with -no-snapshot-save.
#   * `script:` is split per line and each line gets its own `sh -c`, so the real
#     test logic lives in .github/scripts/emulator-smoke-test.sh (one line here).

on:
  push:
    branches: [main, 'arena/**']
    paths:
      - 'android/**'
      - 'android-rs/**'
      - 'ish-rs/**'
      - '.github/scripts/**'
      - '.github/workflows/android-emulator.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'android-rs/**'
      - 'ish-rs/**'
      - '.github/scripts/**'
  workflow_dispatch:

# Emulator jobs are long; two runs at once on the same ref just waste each other.
concurrency:
  group: android-emulator-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  API_LEVEL: '34'
  TARGET: google_apis        # x86_64 image guaranteed to exist; 'default' is lighter if you prefer it
  ARCH: x86_64
  PROFILE: pixel_6
  AVD_NAME: ish-test
  SCREENSHOT_DIR: android-rs/screenshots

jobs:
  emulator:
    name: Build APK + run on emulator (KVM, AVD snapshot cache)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # Only the screenshot-publish step writes to the repo; everything else is read-only.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      # --- terminal assets -------------------------------------------------
      # hterm_all.js must exist in the app's assets before Gradle packages it.
      - name: Prepare hterm terminal assets
        run: bash .github/scripts/init-hterm-assets.sh

      # --- build -----------------------------------------------------------
      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      # Pinned so the optional cargo-apk build below does not depend on whatever
      # Rust version the runner image happens to ship this month.
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.89.0
        with:
          targets: aarch64-linux-android, x86_64-linux-android

      # Installs a matching Gradle and caches ~/.gradle - the repo's gradlew is a
      # stand-in wrapper with no gradle-wrapper.jar, so it relies on this.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.6'   # matches android/gradle/wrapper/gradle-wrapper.properties

      # Pre-install what AGP would otherwise auto-download: /usr/local/lib/android/sdk
      # is read-only for the runner user, so a missing platform turns into
      # "Failed to install the following Android SDK components" instead of a build.
      - name: Install the SDK packages the app declares
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platform-tools" "platforms;android-${API_LEVEL}" "build-tools;34.0.0" 2>&1 | tail -n 3
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"

      - name: Build Kotlin APK (WebView + hterm shell)
        working-directory: android
        run: |
          set +e
          gradle --no-daemon --stacktrace assembleDebug 2>&1 | tee "$GITHUB_WORKSPACE/gradle-build.log"
          rc=${PIPESTATUS[0]}
          set -e
          # Ship the build log with the evidence artifact (*.txt is already in its path list).
          mkdir -p "$GITHUB_WORKSPACE/$SCREENSHOT_DIR"
          tail -n 400 "$GITHUB_WORKSPACE/gradle-build.log" > "$GITHUB_WORKSPACE/$SCREENSHOT_DIR/gradle-build.txt" || true
          if [ "$rc" -ne 0 ]; then
            LOG="$GITHUB_WORKSPACE/gradle-build.log"
            {
              # `^e: ` is how kotlinc reports real compile errors; javac/AAPT use `error:`.
              grep -E '^e: |^[0-9]+: error: |error: ' "$LOG" | head -n 15
              grep -E 'What went wrong' -A 5 "$LOG" | head -n 12
              grep -E '> Task .*FAILED' "$LOG" | head -n 5
            } > /tmp/err.txt || true
            [ -s /tmp/err.txt ] || tail -n 25 "$LOG" > /tmp/err.txt
            # Annotations are the only channel that survives back to a plain API
            # client (raw logs and artifacts sit on blob storage), so keep it short.
            MSG=$(head -c 4500 /tmp/err.txt | sed 's/%/%25/g' |
                  awk '{printf "%s%s", (NR > 1 ? "%0A" : ""), $0}')
            echo "::error::gradle assembleDebug failed (exit $rc): %0A${MSG}"
            {
              printf '\n### gradle assembleDebug failed\n\n```\n'
              head -c 4500 /tmp/err.txt
              printf '\n```\n'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$rc"

      - name: Build pure Rust APK (optional - Slint/android-activity via cargo-apk)
        working-directory: android-rs
        continue-on-error: true
        run: |
          rustup target add aarch64-linux-android x86_64-linux-android
          # cargo-apk drives cargo-ndk internally, so both are needed.
          cargo install cargo-ndk cargo-apk --force --locked
          cargo apk build --release || echo "::warning::cargo apk build failed - falling back to the Kotlin shell APK"

      # Fail here, not 30 emulator-minutes later, when nothing is installable.
      - name: Verify an APK was produced
        run: |
          find android android-rs -name '*.apk' -type f | sed 's/^/found: /'
          if [ -z "$(find android android-rs -name '*.apk' -type f -print -quit)" ]; then
            echo "::error::No APK was produced by either builder; the emulator would have nothing to install."
            exit 1
          fi

      # --- AVD snapshot cache ----------------------------------------------
      - name: Restore cached AVD
        id: avd-cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          # Bump the trailing vN whenever AVD-affecting inputs change (cores, ram-size)
          # so a stale, incompatible snapshot is never restored.
          key: avd-${{ env.API_LEVEL }}-${{ env.TARGET }}-${{ env.ARCH }}-${{ env.PROFILE }}-${{ env.AVD_NAME }}-v1

      # Only runs on a cache miss: boot once, let the action save the snapshot on exit.
      - name: Create AVD and snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API_LEVEL }}
          target: ${{ env.TARGET }}
          arch: ${{ env.ARCH }}
          profile: ${{ env.PROFILE }}
          avd-name: ${{ env.AVD_NAME }}
          cores: 2
          ram-size: 4096M
          force-avd-creation: false
          emulator-boot-timeout: 900
          disable-animations: false
          enable-hw-keyboard: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: echo "Generated AVD snapshot for caching."

      # --- the actual test --------------------------------------------------
      # Inputs affecting the AVD must match the snapshot step, or the cached AVD
      # and this run disagree.
      - name: Run APK on Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API_LEVEL }}
          target: ${{ env.TARGET }}
          arch: ${{ env.ARCH }}
          profile: ${{ env.PROFILE }}
          avd-name: ${{ env.AVD_NAME }}
          cores: 2
          ram-size: 4096M
          force-avd-creation: false
          emulator-boot-timeout: 600
          disable-animations: true
          disable-spellchecker: true
          enable-hw-keyboard: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/emulator-smoke-test.sh

      - name: Upload emulator evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: emulator-evidence
          path: |
            ${{ env.SCREENSHOT_DIR }}/*.png
            ${{ env.SCREENSHOT_DIR }}/*.txt
            ${{ env.SCREENSHOT_DIR }}/*.xml
            android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 14

      # Publishing to a branch makes the screenshots viewable at a stable raw URL
      # that the job summary links to. It must never break CI.
      - name: Publish screenshots to debug branch
        if: always() && github.event_name != 'pull_request'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash .github/scripts/publish-screenshots.sh "$SCREENSHOT_DIR" debug/android-emulator-latest
