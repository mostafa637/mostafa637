name: Android Emulator Smoke Test

# One place for "build the APK and prove it runs on a real emulator".
# The config below follows the action's own README (ReactiveCircus/android-emulator-runner):
#   * enable KVM perms, otherwise /dev/kvm exists but the runner cannot use it and
#     x86_64 images refuse to boot -> "Timeout waiting for emulator to boot."
#   * never pass -accel on by hand: the action's disable-linux-hw-accel=auto adds
#     -accel off when KVM is missing; a manual -accel on just hard-fails the boot.
#   * cold boot every run (-no-snapshot) is the other half of that timeout, so the
#     AVD + its boot snapshot are cached and reused with -no-snapshot-save.
#   * `script:` is split per line and each line gets its own `sh -c`, so the real
#     test logic lives in .github/scripts/emulator-smoke-test.sh (one line here).

on:
  push:
    branches: [main, 'arena/**']
    paths:
      - 'android/**'
      - 'android-rs/**'
      - 'ish-rs/**'
      - '.github/scripts/**'
      - '.github/workflows/android-emulator.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'android-rs/**'
      - 'ish-rs/**'
      - '.github/scripts/**'
  workflow_dispatch:

# Emulator jobs are long; two runs at once on the same ref just waste each other.
# A push replaces a PR run, but never kills a run that is already 15 minutes into an
# emulator job: with cancel-in-progress the next push cancels the build mid-flight and
# the AVD cache never gets written. Queuing instead costs a few minutes and keeps both.
concurrency:
  group: android-emulator-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  API_LEVEL: '34'
  TARGET: google_apis        # x86_64 image guaranteed to exist; 'default' is lighter if you prefer it
  ARCH: x86_64
  PROFILE: pixel_6
  AVD_NAME: ish-test
  SCREENSHOT_DIR: android-rs/screenshots

jobs:
  emulator:
    name: Build APK + run on emulator (KVM, AVD snapshot cache)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # Only the screenshot-publish step writes to the repo; everything else is read-only.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      # --- terminal assets (packaged into the APK) -------------------------------
      # Must run before the build so the files land inside the archive.
      - name: Prepare hterm terminal assets
        run: bash .github/scripts/init-hterm-assets.sh

      # --- build the one and only APK: pure Rust via cargo-apk -------------------
      # The Kotlin/Gradle shell module (android/) is gone from the repo, so this job
      # builds the crate that ships the app: android-rs, a cdylib loaded by
      # android.app.NativeActivity through the android_main symbol.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      # Deliberately BEFORE the pinned 1.89 toolchain, using the runner's own newer
      # stable: current cargo-apk/cargo-ndk releases need a newer rustc to *build* than
      # the project's pinned one. The failure used to be invisible under
      # continue-on-error, which is why this repo never had a Rust APK. The installed
      # binaries only shell out to cargo afterwards, so 1.89 still builds the app.
      - name: Install cargo-apk and cargo-ndk
        run: |
          set +e
          {
            echo "== toolchain on PATH =="
            cargo --version; rustc --version
            echo "== installing =="
            cargo install cargo-ndk cargo-apk --force --locked
          } > /tmp/tools.log 2>&1
          rc=$?
          ls -l "$HOME/.cargo/bin" | grep -E "cargo-(ndk|apk)" >> /tmp/tools.log 2>&1
          set -e
          TAIL=$(tail -n 14 /tmp/tools.log | sed 's/%/%25/g' | awk '{printf "%s%s", (NR>1?"%0A":""), $0}')
          if [ "$rc" -ne 0 ]; then
            echo "::error::cargo install failed (exit $rc): %0A${TAIL}"
            exit "$rc"
          fi
          cargo apk --version > /tmp/tools2.log 2>&1; rc2=$?
          cargo ndk --version >> /tmp/tools2.log 2>&1; rc3=$?
          if [ "$rc2" -ne 0 ] || [ "$rc3" -ne 0 ]; then
            # The crates built but the subcommands do not resolve - usually a
            # ~/.cargo/bin that is not on PATH for later steps, or a binary that
            # renamed its CLI. Say which, instead of dying with a bare exit code.
            echo "::error::cargo-apk/cargo-ndk installed but are not callable (apk=$rc2 ndk=$rc3): %0A$(cat /tmp/tools2.log | sed 's/%/%25/g' | awk '{printf "%s%s", (NR>1?"%0A":""), $0}')%0Ainstall log:%0A${TAIL}"
            exit 1
          fi
          echo "cargo-apk and cargo-ndk are on PATH and answering"

      - name: Set up Rust with the Android target
        uses: dtolnay/rust-toolchain@1.89.0
        with:
          targets: x86_64-linux-android

      # cargo-ndk finds the NDK under $ANDROID_HOME/ndk/<version> on its own, but
      # nothing installs it by default and there is no aapt without build-tools.
      - name: Install NDK and build-tools
        run: |
          sdkmanager --install "ndk;26.1.10909125" "build-tools;34.0.0" "platforms;android-${API_LEVEL}" 2>&1 | tail -n 2
          ls "$ANDROID_HOME/ndk" && ls "$ANDROID_HOME/build-tools"

      # Cargo.toml pins build_targets to x86_64 only, so this builds one ABI; a debug
      # build is deliberate - opt-level 3 + a full Slint/femtovg graph for a smoke
      # test would buy nothing but minutes.
      - name: Build the pure Rust APK
        working-directory: android-rs
        run: |
          set +e
          cargo apk build 2>&1 | tee "$GITHUB_WORKSPACE/cargo-apk.log"
          rc=${PIPESTATUS[0]}
          set -e
          mkdir -p "$GITHUB_WORKSPACE/$SCREENSHOT_DIR"
          tail -n 400 "$GITHUB_WORKSPACE/cargo-apk.log" > "$GITHUB_WORKSPACE/$SCREENSHOT_DIR/cargo-apk.txt" || true
          if [ "$rc" -ne 0 ]; then
            {
              grep -E '^error(\[|:)|^error: |undefined reference|No such file|error: could not compile' "$GITHUB_WORKSPACE/cargo-apk.log" | head -n 15
              grep -E 'cargo-apk|keystore|SDK|NDK' "$GITHUB_WORKSPACE/cargo-apk.log" | head -n 8
            } > /tmp/err.txt || true
            [ -s /tmp/err.txt ] || tail -n 25 "$GITHUB_WORKSPACE/cargo-apk.log" > /tmp/err.txt
            MSG=$(head -c 4500 /tmp/err.txt | sed 's/%/%25/g' | awk '{printf "%s%s", (NR > 1 ? "%0A" : ""), $0}')
            echo "::error::cargo apk build failed (exit $rc): %0A${MSG}"
            { printf '\n### cargo apk build failed\n\n```\n'; head -c 4500 /tmp/err.txt; printf '\n```\n'; } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$rc"

      # Fail here, not 30 emulator-minutes later, when nothing is installable.
      - name: Verify the APK was produced
        run: |
          find android-rs/target -name '*.apk' -type f | sed 's/^/found: /' || true
          APK=$(find android-rs/target -name '*.apk' -type f -print -quit)
          if [ -z "$APK" ]; then
            echo "::error::cargo-apk produced no APK; the emulator would have nothing to install."
            exit 1
          fi
          # The manifest must carry the NativeActivity entry and the lib name, or the
          # app installs and dies on launch with an UnsatisfiedLinkError.
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt | head -n 1)
          "$AAPT" dump badging "$APK" | grep -E "package: name|launchable-activity|native-code|sdkVersion" | sed 's/^/  /'
          "$AAPT" dump badging "$APK" | grep -q "x86_64" || { echo "::error::APK has no x86_64 native code - the emulator cannot run it"; exit 1; }
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      # --- AVD snapshot cache ----------------------------------------------
      - name: Restore cached AVD
        id: avd-cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          # Bump the trailing vN whenever AVD-affecting inputs change (cores, ram-size)
          # so a stale, incompatible snapshot is never restored.
          key: avd-${{ env.API_LEVEL }}-${{ env.TARGET }}-${{ env.ARCH }}-${{ env.PROFILE }}-${{ env.AVD_NAME }}-v1

      # Only runs on a cache miss: boot once, let the action save the snapshot on exit.
      - name: Create AVD and snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API_LEVEL }}
          target: ${{ env.TARGET }}
          arch: ${{ env.ARCH }}
          profile: ${{ env.PROFILE }}
          avd-name: ${{ env.AVD_NAME }}
          cores: 2
          ram-size: 4096M
          force-avd-creation: false
          emulator-boot-timeout: 900
          disable-animations: false
          enable-hw-keyboard: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: echo "Generated AVD snapshot for caching."

      # --- the actual test --------------------------------------------------
      # Inputs affecting the AVD must match the snapshot step, or the cached AVD
      # and this run disagree.
      - name: Run APK on Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API_LEVEL }}
          target: ${{ env.TARGET }}
          arch: ${{ env.ARCH }}
          profile: ${{ env.PROFILE }}
          avd-name: ${{ env.AVD_NAME }}
          cores: 2
          ram-size: 4096M
          force-avd-creation: false
          emulator-boot-timeout: 600
          disable-animations: true
          disable-spellchecker: true
          enable-hw-keyboard: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/emulator-smoke-test.sh

      - name: Upload emulator evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: emulator-evidence
          path: |
            ${{ env.SCREENSHOT_DIR }}/*.png
            ${{ env.SCREENSHOT_DIR }}/*.txt
            ${{ env.SCREENSHOT_DIR }}/*.xml
            android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 14

      # Publishing to a branch makes the screenshots viewable at a stable raw URL
      # that the job summary links to. It must never break CI.
      - name: Publish screenshots to debug branch
        if: always() && github.event_name != 'pull_request'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash .github/scripts/publish-screenshots.sh "$SCREENSHOT_DIR" debug/android-emulator-latest
