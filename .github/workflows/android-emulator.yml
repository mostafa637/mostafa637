name: GTK Android Emulator

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  emulator-test:
    name: Install and run GTK APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run APK on Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_2
          force-avd-creation: true
          cores: 2
          ram-size: 2048M
          heap-size: 512M
          disk-size: 4096M
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect
          disable-animations: true
          script: |
            set -e
            adb wait-for-device
            adb install -r gtk-hello-android/gtk-hello-android-release.apk
            adb shell pm clear com.example.gtkhelloworld || true
            adb shell am force-stop com.example.gtkhelloworld || true
            adb shell am start -W -n com.example.gtkhelloworld/org.gtk.android.ToplevelActivity
            sleep 10
            adb logcat -d -v threadtime > gtk-hello-android/logcat.txt || true
            adb exec-out screencap -p > gtk-hello-android/emulator-screen.png || true
            pid="$(adb shell pidof com.example.gtkhelloworld | tr -d '\r')"
            if [ -z "$pid" ]; then
              echo 'GTK application is not running; recent logcat follows:'
              tail -200 gtk-hello-android/logcat.txt
              exit 1
            fi
            adb shell dumpsys activity activities | grep -q 'com.example.gtkhelloworld'

      - name: Upload APK and emulator screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gtk-hello-android-results
          path: |
            gtk-hello-android/gtk-hello-android-release.apk
            gtk-hello-android/emulator-screen.png
            gtk-hello-android/logcat.txt
          if-no-files-found: warn
