name: build-book

on:
  push:
    branches: ["**"]
    paths:
      - "sicp-typst/**"
      - ".github/workflows/build-book.yml"
  pull_request:
    paths:
      - "sicp-typst/**"
      - ".github/workflows/build-book.yml"
  workflow_dispatch:

concurrency:
  group: build-book-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile & sanity-check the book
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: sicp-typst
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install typst 0.15.0 (Python binding)
        run: |
          python -m pip install --upgrade pip
          python -m pip install "typst==0.15.0"
          python -c "import typst; print('typst binding OK')"

      # The committed .calepin/calepin.typ bootstrap facade re-exports
      # @preview/calepin:0.1.0, so the package must be present under the
      # typst package directory. Sparse-clone the official packages repo
      # and keep the version-level directory layout.
      - name: Install calepin 0.1.0 package
        run: |
          git clone --filter=blob:none --sparse --depth 1 \
            https://github.com/typst/packages "$RUNNER_TEMP/typst-packages"
          git -C "$RUNNER_TEMP/typst-packages" sparse-checkout set \
            packages/preview/calepin/0.1.0
          mkdir -p "$HOME/.local/share/typst/packages/preview"
          cp -r "$RUNNER_TEMP/typst-packages/packages/preview/calepin" \
            "$HOME/.local/share/typst/packages/preview/"
          ls "$HOME/.local/share/typst/packages/preview/calepin/0.1.0" | head

      - name: Sanity check — every file compiles
        run: python tools/check.py

      - name: Build book-en.pdf and book-ar.pdf
        run: python tools/build.py dist

      - name: Upload PDF artifacts
        uses: actions/upload-artifact@v4
        with:
          name: book-pdfs-${{ github.sha }}
          path: |
            sicp-typst/dist/book-en.pdf
            sicp-typst/dist/book-ar.pdf
          if-no-files-found: error
          retention-days: 14
