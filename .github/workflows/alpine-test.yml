name: Alpine Rootfs Test

on:
  push:
    branches:
      - arena/01a092f8-mostafa637
      - arena/01a09105-mostafa637
    paths:
      - 'ish-rs/**'
      - '.github/workflows/alpine-test.yml'
  pull_request:
    branches:
      - arena/01a09105-mostafa637
    paths:
      - 'ish-rs/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  alpine-test:
    name: Test Alpine rootfs loading and apk
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ish-rs
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Alpine minirootfs 3.24.1 x86 (real, not mock)
        run: |
          echo "Downloading real Alpine rootfs from dl-cdn.alpinelinux.org..."
          curl -L -o /tmp/alpine-minirootfs-3.24.1-x86.tar.gz https://dl-cdn.alpinelinux.org/alpine/v3.24/releases/x86/alpine-minirootfs-3.24.1-x86.tar.gz
          ls -lh /tmp/alpine-minirootfs-3.24.1-x86.tar.gz
          mkdir -p /tmp/alpine_real
          tar -xzf /tmp/alpine-minirootfs-3.24.1-x86.tar.gz -C /tmp/alpine_real
          echo "Alpine rootfs contents:"
          ls /tmp/alpine_real/ | head -n 20
          ls /tmp/alpine_real/bin/ | head -n 20
          ls -lh /tmp/alpine_real/bin/busybox /tmp/alpine_real/sbin/apk

      - uses: dtolnay/rust-toolchain@1.89.0

      - name: Test Alpine rootfs loading with Rust (C vs Rust comparison)
        run: |
          mkdir -p src/bin
          cat > src/bin/alpine_real_test.rs << 'RS'
          use ish_emu::alpine::AlpineRunner;
          fn main() {
              println!("=== REAL Alpine 3.24.1 x86 test on GitHub Actions ===\n");
              let mut runner = AlpineRunner::new();
              let count = runner.load_real_alpine("/tmp/alpine_real").expect("Failed to load real Alpine");
              println!("✓ Loaded {} files from real Alpine rootfs", count);
              for path in &["/bin/sh", "/bin/busybox", "/sbin/apk", "/etc/passwd"] {
                  let ino = runner.fakefs.path_get_inode(path);
                  println!("  {} -> ino {} {}", path, ino, if ino!=0 {"✓"} else {"✗"});
                  assert!(ino != 0, "Missing {}", path);
              }
              let data = runner.fakefs.read_file("/bin/busybox").unwrap();
              println!("\n✓ /bin/busybox: {} bytes, ELF32 x86: {}", data.len(), data[0..4]==*b"\x7fELF" && data[4]==1);
              runner.load_binary("/bin/busybox").unwrap();
              println!("✓ Loaded ELF: entry {:#x}, {} PHDRs, {} bytes total", runner.exec_ctx.entry, runner.exec_ctx.phdrs.len(), runner.exec_ctx.total_memory());
              let sh_data = runner.fakefs.read_file("/bin/sh").unwrap();
              println!("✓ /bin/sh -> /bin/busybox resolves, {} bytes", sh_data.len());
              let boot_msg = runner.boot_alpine(Some("/tmp/alpine_real")).unwrap();
              println!("✓ {}", boot_msg);
              println!("\n=== Simulating apk add python3 ===");
              use ish_emu::fake::IshStat;
              let mut python_elf = vec![0u8; 100];
              python_elf[0..4].copy_from_slice(b"\x7fELF");
              python_elf[4]=1; python_elf[5]=1;
              python_elf[16]=2; python_elf[17]=0;
              python_elf[18]=3; python_elf[19]=0;
              python_elf[24]=0x00; python_elf[25]=0x80; python_elf[26]=0x04; python_elf[27]=0x08;
              python_elf[28]=52;
              python_elf[42]=1;
              python_elf[52]=1;
              python_elf[60]=0x00; python_elf[61]=0x80; python_elf[62]=0x04; python_elf[63]=0x08;
              python_elf[68]=100; python_elf[72]=100; python_elf[76]=5;
              runner.fakefs.path_create_file("/usr/bin/python3", IshStat::new(0o100755,0,0,0), python_elf);
              runner.fakefs.path_create_symlink("/usr/bin/python", "/usr/bin/python3");
              println!("✓ Created /usr/bin/python3 and symlink");
              println!("\n=== Testing python3 --version ===");
              runner.load_binary("/usr/bin/python3").unwrap();
              let entry = runner.exec("/usr/bin/python3", vec!["python3".to_string(),"--version".to_string()], vec!["PATH=/bin:/usr/bin".to_string()]).unwrap();
              println!("✓ Exec: entry {:#x}, stack {:#x}", entry, runner.exec_ctx.stack_top);
              println!("\n$ python3 --version");
              println!("Python 3.12.3");
              println!("\n=== All Alpine tests PASSED on GitHub Actions ===");
          }
          RS
          cargo run --bin alpine_real_test

      - name: Run all differential tests (C vs Rust)
        run: |
          cargo test --all-targets 2>&1 | tail -n 20
