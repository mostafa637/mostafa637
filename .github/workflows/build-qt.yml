name: Build iSH Qt/QML

on:
  push:
    branches: [main, ish-qt-qml]
  pull_request:
    branches: [main, ish-qt-qml]
  workflow_dispatch:

permissions:
  contents: read

env:
  QT_VERSION: 6.11.1
  QT_MODULES: qtwebview qtwebchannel qtwebsockets
  BUILD_TYPE: Release

jobs:
  qml-lint:
    name: QML lint (Qt 6.11.1)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install aqtinstall
        run: python -m pip install --upgrade aqtinstall

      - name: Install Qt desktop with aqtinstall
        run: |
          python -m aqt install-qt linux desktop "${QT_VERSION}" linux_gcc_64 \
            --outputdir "$RUNNER_TEMP/Qt" \
            --modules $QT_MODULES

      - name: Run qmllint
        env:
          QT_ROOT: ${{ runner.temp }}/Qt/${{ env.QT_VERSION }}/gcc_64
        run: |
          "$QT_ROOT/bin/qmllint" --max-warnings 1000000 --import=disable \
            -I ish-qt-qml/android-qt/qml \
            ish-qt-qml/android-qt/qml/Main.qml \
            ish-qt-qml/android-qt/qml/*.qml \
            ish-qt-qml/android-qt/qml/IshIOSStyle/*.qml

  build-linux:
    name: Linux Desktop
    needs: qml-lint
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang lld libarchive-dev

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install aqtinstall
        run: python -m pip install --upgrade aqtinstall

      - name: Install Qt desktop with aqtinstall
        run: |
          python -m aqt install-qt linux desktop "${QT_VERSION}" linux_gcc_64 \
            --outputdir "$RUNNER_TEMP/Qt" \
            --modules $QT_MODULES

      - name: Check complete core bridge
        run: ./ish-qt-qml/ci/check-source-completeness.sh linux

      - name: Configure Linux
        env:
          QT_ROOT: ${{ runner.temp }}/Qt/${{ env.QT_VERSION }}/gcc_64
        run: |
          cmake -S ish-qt-qml/android-qt -B build-linux -G Ninja \
            -DCMAKE_BUILD_TYPE="$BUILD_TYPE" \
            -DCMAKE_PREFIX_PATH="$QT_ROOT"

      - name: Build Linux
        run: cmake --build build-linux --parallel 2

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: ish-qt-linux-x86_64
          path: build-linux/ish_qt_android
          if-no-files-found: error

  build-android:
    name: Android ${{ matrix.abi }}
    needs: qml-lint
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            qt_arch: android_arm64_v8a
          - abi: x86_64
            qt_arch: android_x86_64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-36" \
            "build-tools;36.0.0" "cmake;3.22.1" \
            "ndk;27.2.12479018"

      - name: Install aqtinstall
        run: python -m pip install --upgrade aqtinstall

      - name: Install Qt host tools with aqtinstall
        run: |
          python -m aqt install-qt linux desktop "${QT_VERSION}" linux_gcc_64 \
            --outputdir "$RUNNER_TEMP/Qt" \
            --modules $QT_MODULES

      - name: Install Qt Android with aqtinstall
        run: |
          python -m aqt install-qt linux android "${QT_VERSION}" "${{ matrix.qt_arch }}" \
            --outputdir "$RUNNER_TEMP/Qt" \
            --modules $QT_MODULES

      - name: Check complete core bridge
        run: ./ish-qt-qml/ci/check-source-completeness.sh android

      - name: Configure Android
        env:
          QT_HOST_ROOT: ${{ runner.temp }}/Qt/${{ env.QT_VERSION }}/gcc_64
          QT_ANDROID_ROOT: ${{ runner.temp }}/Qt/${{ env.QT_VERSION }}/${{ matrix.qt_arch }}
          ANDROID_NDK_ROOT: ${{ env.ANDROID_NDK_ROOT }}
        run: |
          cmake -S ish-qt-qml/android-qt -B "build-${{ matrix.abi }}" -G Ninja \
            -DCMAKE_BUILD_TYPE="$BUILD_TYPE" \
            -DCMAKE_PREFIX_PATH="$QT_ANDROID_ROOT" \
            -DQT_HOST_PATH="$QT_HOST_ROOT" \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI="${{ matrix.abi }}" \
            -DANDROID_PLATFORM=android-28

      - name: Build Android Release
        run: cmake --build "build-${{ matrix.abi }}" --parallel 2

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: ish-qt-android-${{ matrix.abi }}
          path: |
            build-${{ matrix.abi }}/android-build/build/outputs/apk/release/*.apk
            build-${{ matrix.abi }}/android-build/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  test-android-avd:
    name: Android AVD smoke test (macOS)
    needs: build-android
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Download arm64 APK
        uses: actions/download-artifact@v4
        with:
          name: ish-qt-android-arm64-v8a
          path: apk

      - name: Install emulator and API 35 arm64 system image
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "emulator" "platforms;android-35" \
            "system-images;android-35;google_apis;arm64-v8a"
          echo "no" | avdmanager create avd --force \
            --name ish-api35-arm64 \
            --package "system-images;android-35;google_apis;arm64-v8a" \
            --device "pixel_6"

      - name: Start AVD without hardware acceleration
        shell: bash
        run: |
          emulator -avd ish-api35-arm64 \
            -no-window -no-audio -no-boot-anim -no-snapshot \
            -gpu swiftshader_indirect -accel off \
            > "$RUNNER_TEMP/emulator.log" 2>&1 &
          adb wait-for-device
          for i in $(seq 1 90); do
            booted="$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')"
            if [ "$booted" = "1" ]; then break; fi
            sleep 2
          done
          test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1"
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0

      - name: Install and launch APK
        shell: bash
        run: |
          apk="$(find apk -type f -name '*.apk' | grep -E '/debug/|debug.*\.apk$' | head -n 1 || true)"
          if [ -z "$apk" ]; then
            apk="$(find apk -type f -name '*.apk' | head -n 1)"
          fi
          test -n "$apk"
          adb install -r "$apk"
          package="$(adb shell pm list packages | sed 's/^package://' | tr -d '\r' | grep -E 'ish|qtproject' | tail -n 1)"
          test -n "$package"
          echo "Detected package: $package"
          adb shell monkey -p "$package" 1
          sleep 15
          adb shell dumpsys activity activities | grep -F "$package"
          adb exec-out screencap -p > avd-screenshot.png
          adb logcat -d > avd-logcat.txt
          if grep -E "FATAL EXCEPTION|UnsatisfiedLinkError|QQmlApplicationEngine failed|module .* is not installed" avd-logcat.txt; then
            echo "Application startup errors detected"
            exit 1
          fi

      - name: Upload AVD diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ish-android-avd-diagnostics
          path: |
            avd-screenshot.png
            avd-logcat.txt
            ${{ runner.temp }}/emulator.log
          if-no-files-found: warn
