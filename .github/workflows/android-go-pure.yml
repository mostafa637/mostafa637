name: Android

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: ish-qt-qml/go-pure

env:
  ANDROID_PLATFORM: android-35
  ANDROID_BUILD_TOOLS: 35.0.0
  ANDROID_NDK_VERSION: 26.3.11579264

jobs:
  verify:
    name: Verify Pure Go core
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: ish-qt-qml/go-pure/go.mod
          cache-dependency-path: ish-qt-qml/go-pure/go.sum
      - name: Format check
        run: test -z "$(gofmt -l cmd internal)"
      - name: Core tests without CGo
        run: |
          for attempt in 1 2; do
            if timeout 480s env CGO_ENABLED=0 go test -p 1 ./internal/core/... ./internal/platform/... ./internal/terminal/... ./internal/session/...; then
              exit 0
            fi
            echo "Core test attempt ${attempt} failed; retrying once."
          done
          exit 1
      - name: Modularity check
        id: modularity
        continue-on-error: true
        run: go run ./cmd/checkmodularity
      - name: Report modularity debt
        if: steps.modularity.outcome == 'failure'
        run: echo "::warning::Modularity debt remains in legacy JIT files; it is reported without blocking the Android artifact."

  build:
    name: Build Android APK
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: ish-qt-qml/go-pure/go.mod
          cache-dependency-path: ish-qt-qml/go-pure/go.sum
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android toolchain
        run: sdkmanager --install "platform-tools" "platforms;${ANDROID_PLATFORM}" "build-tools;${ANDROID_BUILD_TOOLS}" "ndk;${ANDROID_NDK_VERSION}"
      - name: Export Android paths
        run: |
          echo "ANDROID_HOME=${ANDROID_SDK_ROOT}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"
      - name: Install gogio
        run: GOTOOLCHAIN=go1.24.0 go install gioui.org/cmd/gogio@v0.8.0
      - name: Build APK
        run: make android GOGIO="$(go env GOPATH)/bin/gogio"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ishgo-android-apk
          path: ish-qt-qml/go-pure/bin/ishgo.apk
          if-no-files-found: error
          retention-days: 14

  emulator:
    name: Smoke test on Android Emulator
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Enable KVM group permissions
        working-directory: .
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Check KVM
        working-directory: .
        run: |
          test -e /dev/kvm
          ls -l /dev/kvm
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: ishgo-android-apk
          path: ish-qt-qml/go-pure/bin
      - name: Run app and capture screenshots
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 2048M
          heap-size: 512M
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -camera-back none -gpu swiftshader_indirect
          script: |
            set -e
            timeout 60s adb install -r "$GITHUB_WORKSPACE/ish-qt-qml/go-pure/bin/ishgo.apk"
            timeout 30s adb shell monkey -p com.mostafa637.ishgo 1
            adb shell settings put secure show_ime_with_hard_keyboard 1 || true
            mkdir -p "$GITHUB_WORKSPACE/emulator-results"
            for i in $(seq 1 30); do
              focus=$(adb shell dumpsys window windows | grep -m1 'mCurrentFocus' || true)
              echo "$focus"
              case "$focus" in *com.mostafa637.ishgo*) break;; esac
              sleep 2
            done
            adb shell input tap 500 500 || true
            sleep 20
            adb exec-out screencap -p > "$GITHUB_WORKSPACE/emulator-results/01-after-launch.png"
            adb logcat -d -t 500 > "$GITHUB_WORKSPACE/emulator-results/01-after-launch.log"
            sleep 15
            adb exec-out screencap -p > "$GITHUB_WORKSPACE/emulator-results/02-after-35s.png"
            adb logcat -d -t 800 > "$GITHUB_WORKSPACE/emulator-results/02-after-35s.log"
            sleep 25
            adb exec-out screencap -p > "$GITHUB_WORKSPACE/emulator-results/03-after-60s.png"
            adb logcat -d -t 1200 > "$GITHUB_WORKSPACE/emulator-results/03-after-60s.log"
      - name: Upload emulator screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ishgo-emulator-results
          path: emulator-results
          if-no-files-found: warn
          retention-days: 14
