# TEMPORARY - delete once the formatting patch it produces has been applied.
#
# Why it exists: `rustfmt --check` in ish-rust.yml fails, and rustfmt output is the
# only acceptable source for a formatting-only change - hand-editing 14 files to
# "look like rustfmt" would churn code and still fail CI. This job runs the real
# formatter, and instead of committing to the branch itself (a bot authoring your
# code) it publishes the patch as an artifact branch file so a human/agent applies it.
name: tmp rustfmt patch capture

on:
  push:
    branches: ['arena/**']
    paths: ['.github/workflows/tmp-rustfmt-capture.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    name: Produce rustfmt patch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: rustfmt

      - name: Format the files ish-rust.yml checks, then publish the diff
        run: |
          set -e
          cd ish-rs
          # The exact file list from ish-rust.yml, including why src/lib.rs is out.
          rustfmt --edition 2021 \
            src/cpu.rs src/user.rs src/task.rs src/group.rs src/getset.rs src/tls.rs \
            src/misc.rs src/ipc.rs src/log.rs src/fake_db.rs src/resource.rs \
            src/random.rs src/uname.rs tests/fpu_differential.rs
          cd "$GITHUB_WORKSPACE"
          git add -A
          git diff --cached HEAD > /tmp/rustfmt.patch
          printf 'patch lines: %s, bytes: %s\n' "$(wc -l < /tmp/rustfmt.patch)" "$(wc -c < /tmp/rustfmt.patch)"
          mkdir -p /tmp/publish && cp /tmp/rustfmt.patch /tmp/publish/rustfmt.patch
          env GITHUB_TOKEN='${{ github.token }}' bash .github/scripts/publish-screenshots.sh /tmp/publish debug/rustfmt-patch
          head -c 3000 /tmp/rustfmt.patch | sed 's/%/%25/g' | awk '{printf "%s%s", (NR>1?"%0A":""), $0}' > /tmp/head.txt
          echo "::notice::rustfmt.patch is at debug/rustfmt-patch (first bytes): $(cat /tmp/head.txt)"
