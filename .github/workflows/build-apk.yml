name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ish-qt-qml]
    paths:
      - 'ish-qt-qml/android-qt/**'
      - 'ish-qt-qml/upstream/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

env:
  QT_VERSION: 6.11.1
  QT_MODULES: qtwebview qtwebchannel qtwebsockets
  BUILD_TYPE: Release

jobs:
  build-apk:
    name: APK ${{ matrix.abi }}
    runs-on: ubuntu-24.04
    env:
      QT_ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/ish-qt-qml/ci/keys/ish-qt-ci-release.keystore
      QT_ANDROID_KEYSTORE_ALIAS: ishqtrelease
      QT_ANDROID_KEYSTORE_STORE_PASS: ish-qt-ci-release
      QT_ANDROID_KEYSTORE_KEY_PASS: ish-qt-ci-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            qt_arch: android_arm64_v8a
          - abi: x86_64
            qt_arch: android_x86_64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang lld

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-36" \
            "build-tools;36.0.0" "cmake;3.22.1" \
            "ndk;27.2.12479018"

      - name: Install aqtinstall
        run: python -m pip install --upgrade aqtinstall

      - name: Install Qt host tools with aqtinstall
        run: |
          python -m aqt install-qt linux desktop "${QT_VERSION}" linux_gcc_64 \
            --outputdir "$RUNNER_TEMP/Qt" \
            --modules $QT_MODULES

      - name: Install Qt Android with aqtinstall
        run: |
          python -m aqt install-qt linux android "${QT_VERSION}" "${{ matrix.qt_arch }}" \
            --outputdir "$RUNNER_TEMP/Qt" \
            --modules $QT_MODULES

      - name: Check complete core bridge
        run: ./ish-qt-qml/ci/check-source-completeness.sh android

      - name: Configure Android
        env:
          QT_HOST_ROOT: ${{ runner.temp }}/Qt/${{ env.QT_VERSION }}/gcc_64
          QT_ANDROID_ROOT: ${{ runner.temp }}/Qt/${{ env.QT_VERSION }}/${{ matrix.qt_arch }}
          ANDROID_NDK_VERSION: 27.2.12479018
        run: |
          QT_TOOLCHAIN="$QT_ANDROID_ROOT/lib/cmake/Qt6/qt.toolchain.cmake"
          test -f "$QT_TOOLCHAIN"
          echo "Using Qt toolchain: $QT_TOOLCHAIN"
          cmake -S ish-qt-qml/android-qt -B "build-${{ matrix.abi }}" -G Ninja \
            -DCMAKE_BUILD_TYPE="$BUILD_TYPE" \
            -DQT_HOST_PATH="$QT_HOST_ROOT" \
            -DCMAKE_TOOLCHAIN_FILE="$QT_TOOLCHAIN" \
            -DANDROID_ABI="${{ matrix.abi }}" \
            -DANDROID_PLATFORM=android-28 \
            -DQT_ANDROID_SIGN_APK=ON

      - name: Build Android Release
        run: cmake --build "build-${{ matrix.abi }}" --parallel 2

      - name: Verify signed Android APK
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find "build-${{ matrix.abi }}/android-build/build/outputs/apk/release" -type f -name '*.apk' ! -name '*unsigned.apk' | head -n 1 || true)"
          test -n "$apk"
          test ! -e "${apk%.apk}-unsigned.apk"
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" verify --verbose "$apk"
          echo "Signed APK: $apk"

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: ish-qt-android-${{ matrix.abi }}
          path: build-${{ matrix.abi }}/android-build/build/outputs/apk/release/*.apk
          if-no-files-found: error
