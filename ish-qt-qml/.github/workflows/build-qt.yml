name: Build iSH Qt/QML

on:
  push:
    branches: [main, ish-qt-qml]
  pull_request:
    branches: [main, ish-qt-qml]
  workflow_dispatch:

permissions:
  contents: read

env:
  QT_VERSION: 6.11.1
  QT_MODULES: qtwebview qtwebchannel qtwebsockets qtsvg qttools
  BUILD_TYPE: Release

jobs:
  qml-lint:
    name: QML lint (Qt ${{ env.QT_VERSION }})
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install aqtinstall
        run: python -m pip install --upgrade aqtinstall

      - name: Install Qt desktop with aqtinstall
        run: |
          python -m aqt install-qt linux desktop "${QT_VERSION}" linux_gcc_64 \
            --outputdir "$RUNNER_TEMP/Qt" \
            --modules $QT_MODULES

      - name: Run qmllint
        env:
          QT_ROOT: ${{ runner.temp }}/Qt/${{ env.QT_VERSION }}/gcc_64
        run: |
          "$QT_ROOT/bin/qmllint" \
            -I android-qt/qml \
            android-qt/qml/Main.qml \
            android-qt/qml/*.qml \
            android-qt/qml/IshIOSStyle/*.qml

  build-linux:
    name: Linux Desktop
    needs: qml-lint
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang lld libarchive-dev

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install aqtinstall
        run: python -m pip install --upgrade aqtinstall

      - name: Install Qt desktop with aqtinstall
        run: |
          python -m aqt install-qt linux desktop "${QT_VERSION}" linux_gcc_64 \
            --outputdir "$RUNNER_TEMP/Qt" \
            --modules $QT_MODULES

      - name: Check complete core bridge
        run: ./ci/check-source-completeness.sh linux

      - name: Configure Linux
        env:
          QT_ROOT: ${{ runner.temp }}/Qt/${{ env.QT_VERSION }}/gcc_64
        run: |
          cmake -S android-qt -B build-linux -G Ninja \
            -DCMAKE_BUILD_TYPE="$BUILD_TYPE" \
            -DCMAKE_PREFIX_PATH="$QT_ROOT"

      - name: Build Linux
        run: cmake --build build-linux --parallel 2

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: ish-qt-linux-x86_64
          path: build-linux/ish_qt_android
          if-no-files-found: error

  build-android:
    name: Android ${{ matrix.abi }}
    needs: qml-lint
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            qt_arch: android_arm64_v8a
          - abi: x86_64
            qt_arch: android_x86_64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-36" \
            "build-tools;36.0.0" "cmake;3.22.1" \
            "ndk;27.2.12479018"

      - name: Install aqtinstall
        run: python -m pip install --upgrade aqtinstall

      - name: Install Qt host tools with aqtinstall
        run: |
          python -m aqt install-qt linux desktop "${QT_VERSION}" linux_gcc_64 \
            --outputdir "$RUNNER_TEMP/Qt" \
            --modules $QT_MODULES

      - name: Install Qt Android with aqtinstall
        run: |
          python -m aqt install-qt linux android "${QT_VERSION}" "${{ matrix.qt_arch }}" \
            --outputdir "$RUNNER_TEMP/Qt" \
            --modules $QT_MODULES

      - name: Check complete core bridge
        run: ./ci/check-source-completeness.sh android

      - name: Configure Android
        env:
          QT_HOST_ROOT: ${{ runner.temp }}/Qt/${{ env.QT_VERSION }}/gcc_64
          QT_ANDROID_ROOT: ${{ runner.temp }}/Qt/${{ env.QT_VERSION }}/${{ matrix.qt_arch }}
          ANDROID_NDK_ROOT: ${{ env.ANDROID_NDK_ROOT }}
        run: |
          cmake -S android-qt -B "build-${{ matrix.abi }}" -G Ninja \
            -DCMAKE_BUILD_TYPE="$BUILD_TYPE" \
            -DCMAKE_PREFIX_PATH="$QT_ANDROID_ROOT" \
            -DQT_HOST_PATH="$QT_HOST_ROOT" \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI="${{ matrix.abi }}" \
            -DANDROID_PLATFORM=android-28

      - name: Build Android Release
        run: cmake --build "build-${{ matrix.abi }}" --parallel 2

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: ish-qt-android-${{ matrix.abi }}
          path: |
            build-${{ matrix.abi }}/android-build/build/outputs/apk/release/*.apk
            build-${{ matrix.abi }}/android-build/build/outputs/apk/debug/*.apk
          if-no-files-found: error
