[package]
name = "ish-android-rs"
version = "0.1.0"
edition = "2021"
description = "iSH Android pure Rust port - SlintUi + Servo WebView + KVM emulator testing + hterm as iOS - ONLINE ONLY (no offline)"
license = "GPL-2.0-or-later"
repository = "https://github.com/ish-app/ish"

[lib]
name = "ish_android_rs"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[[bin]]
name = "ish-android-rs"
path = "src/main.rs"

[dependencies]
ish-emu = { path = "../ish-rs" }
# Online only - fetched from crates.io on GitHub Actions (no offline, as requested)
# Slint is optional to allow fast cargo test --lib --no-default-features on CI (avoids heavy compile)
# backend-android-activity-06 is safe to enable on every target: Slint selects the
# winit backend for desktop builds and the android-activity one when
# target_os = "android", so the same feature list works for both CI jobs.
slint = { version = "1.8.0", features = ["backend-winit", "renderer-femtovg", "backend-android-activity-06", "compat-1-2"], optional = true }
log = { version = "0.4", optional = true }
android_logger = { version = "0.13", optional = true }

[build-dependencies]
slint-build = { version = "1.8.0", optional = true }

[features]
default = ["slint-ui", "android"]
slint-ui = ["dep:slint", "dep:slint-build", "dep:log"]
android = ["dep:android_logger"]
# Fast test without heavy Slint compilation (for rust-core-test-online job)
fast-test = []

# cargo-apk's schema, verified against rust-mobile/cargo-apk's README. The previous
# keys here were invented (`app_icon`, `[package.metadata.android.permissions]`),
# and there was no build_targets, so cargo-apk fell back to aarch64 only - an
# x86_64 emulator then rejects the APK with INSTALL_FAILED_NO_MATCHING_ABIS.
[package.metadata.android]
package = "com.ish.emulator.rust"
apk_name = "ish-android-rs"
assets = "assets"
# One ABI: the CI emulator image is x86_64, and building a single target instead of
# four keeps an already slow job down to one crate graph.
build_targets = ["x86_64-linux-android"]

[package.metadata.android.sdk]
# API 26 is the floor for Slint's android-activity backend; 24 was not runnable.
min_sdk_version = 26
target_sdk_version = 34
compile_sdk_version = 34

[package.metadata.android.application]
label = "iSH Emulator (Pure Rust)"
# NativeActivity wants a fullscreen no-action-bar theme, otherwise the app starts
# with a title bar eating rows the terminal then has to wrap into.
theme = "@android:style/Theme.DeviceDefault.NoActionBar.Fullscreen"

[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"

[[package.metadata.android.uses_permission]]
name = "android.permission.ACCESS_NETWORK_STATE"

[profile.release]
opt-level = 3
debug = true
lto = false
