[package]
name = "ish-android-rs"
version = "0.1.0"
edition = "2021"
description = "iSH Android pure Rust port - SlintUi + Servo WebView + KVM emulator testing + hterm as iOS - ONLINE ONLY (no offline)"
license = "GPL-2.0-or-later"
repository = "https://github.com/ish-app/ish"

[lib]
name = "ish_android_rs"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[[bin]]
name = "ish-android-rs"
path = "src/main.rs"

[dependencies]
ish-emu = { path = "../ish-rs" }
# Online only - fetched from crates.io on GitHub Actions (no offline, as requested)
slint = { version = "1.8.0", features = ["backend-winit", "renderer-femtovg", "compat-1-2"] }
log = "0.4"
android_logger = "0.13"
android-activity = { version = "0.6.0", features = ["native-activity"] }
ndk = "0.8"
winit = "0.29"
slint-build = "1.8.0"

[package.metadata.android]
package = "com.ish.emulator.rust"
apk_name = "ish-android-rs"
app_icon = "@mipmap/ic_launcher"
assets = "assets"

[package.metadata.android.sdk]
min_sdk_version = 24
target_sdk_version = 34
compile_sdk_version = 34

[package.metadata.android.permissions]
INTERNET = {}
ACCESS_NETWORK_STATE = {}

[profile.release]
opt-level = 3
debug = true
lto = false
