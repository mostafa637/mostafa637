[package]
name = "ish-android-rs"
version = "0.1.0"
edition = "2021"
description = "iSH Android pure Rust port - SlintUi + Servo WebView + KVM emulator testing + hterm as iOS - ONLINE ONLY (no offline)"
license = "GPL-2.0-or-later"
repository = "https://github.com/ish-app/ish"

[lib]
name = "ish_android_rs"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[[bin]]
name = "ish-android-rs"
path = "src/main.rs"

[dependencies]
ish-emu = { path = "../ish-rs" }
# Online only - fetched from crates.io on GitHub Actions (no offline, as requested)
# Slint is optional to allow fast cargo test --lib --no-default-features on CI (avoids heavy compile)
slint = { version = "1.8.0", features = ["backend-winit", "renderer-femtovg", "compat-1-2"], optional = true }
log = { version = "0.4", optional = true }
android_logger = { version = "0.13", optional = true }
android-activity = { version = "0.6.0", features = ["native-activity"], optional = true }
ndk = { version = "0.8", optional = true }

[build-dependencies]
slint-build = { version = "1.8.0", optional = true }

[features]
default = ["slint-ui", "android"]
slint-ui = ["dep:slint", "dep:slint-build", "dep:log"]
android = ["dep:android_logger", "dep:android-activity", "dep:ndk"]
# Fast test without heavy Slint compilation (for rust-core-test-online job)
fast-test = []

[package.metadata.android]
package = "com.ish.emulator.rust"
apk_name = "ish-android-rs"
app_icon = "@mipmap/ic_launcher"
assets = "assets"

[package.metadata.android.sdk]
min_sdk_version = 24
target_sdk_version = 34
compile_sdk_version = 34

[package.metadata.android.permissions]
INTERNET = {}
ACCESS_NETWORK_STATE = {}

[profile.release]
opt-level = 3
debug = true
lto = false
